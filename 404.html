  <title>Page Not Found | Casa4 Developments</title>

  <style>
    :root {
      --bg: #4b5056;
      --panel: #3e4349;
      --text: #fff;
      --muted: #e5e5e5;
      --accent: #4f8d45;
      --accent-hover: #3d7836;
      --orange: #c05515;
      --orange-hover: #a04611;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .site-header {
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .logo img {
      display: block;
      width: 120px;
      height: auto;
      margin: 0 auto;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      width: 100%;
      padding: 48px 20px;
    }

    .not-found-card {
      width: min(720px, 100%);
      padding: 48px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      background: var(--panel);
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,0.22);
    }

    .status-code {
      margin: 0;
      color: #a9d6a2;
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 800;
      line-height: 1;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
    }

    .intro {
      max-width: 570px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .primary-actions,
    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .contact-actions { margin-top: 16px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .button:hover,
    .button:focus-visible { transform: translateY(-1px); }

    .button-primary { background: var(--orange); }
    .button-primary:hover,
    .button-primary:focus-visible { background: var(--orange-hover); }

    .button-secondary { background: rgba(255,255,255,0.12); }
    .button-secondary:hover,
    .button-secondary:focus-visible { background: rgba(255,255,255,0.2); }

    .button-contact { background: var(--accent); }
    .button-contact:hover,
    .button-contact:focus-visible { background: var(--accent-hover); }

    footer {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    footer p { margin: 4px 0; }

    @media (max-width: 560px) {
      .site-header { padding: 18px; }
      main { padding: 32px 16px; }
      .not-found-card { padding: 34px 20px; }
      .primary-actions,
      .contact-actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>

  <header class="site-header">

      <img src="/images/logo.png" alt="Casa4 Developments" width="120" height="68">
    </a>
  </header>

  <main>
    <section class="not-found-card" aria-labelledby="not-found-title">
      <p class="status-code" aria-hidden="true">404</p>
      <h1 id="not-found-title">Page not found</h1>
      <p class="intro">The page may have moved or the address may be incorrect. You can return home, browse our services, or contact the Casa4 team for help.</p>

      <div class="primary-actions">
        <a class="button button-primary" href="/">Return Home</a>
        <a class="button button-secondary" href="/services">Browse Services</a>
        <a class="button button-secondary" href="/contact">Request a Quote</a>
      </div>

      <div class="contact-actions">
        <a class="button button-contact" href="tel:01489290012">Call 01489 290012</a>
        <a class="button button-contact" href="https://wa.me/447900281011">WhatsApp Us</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Casa4 Developments</p>
    <p>Fareham, Hampshire &amp; South Coast</p>
  </footer>

  <script src="/assets/lead-capture.js" defer></script>
</body>
</html>
